async function loadDashboardData() {

        const result = await response.json();
        
        console.log('📊 Dashboard API Response:', result);
        
        if (result.success && result.data) {
            console.log('📥 Dashboard loaded', result.data.length, 'records from', result.source || 'Evaluations tab');

        }

        console.error('Error loading dashboard data:', error);

async function loadFormData() {

async function saveData(data) {
    if (isSyncing) return;
    isSyncing = true;
    
    try {
        document.getElementById('syncStatus').style.display = 'inline';
        
        const response = await fetch(GOOGLE_SHEETS_API_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'text/plain;charset=utf-8',
            },
            body: JSON.stringify({ data: data })
        });
        
        const result = await response.json();
        
        if (response.ok && result.success) {
            console.log('💾 Saved', result.count, 'records to', result.savedTo || 'Google Sheets');
            document.getElementById('adminRecordCount').textContent = data.length;
        } else {
            console.error('Failed to save:', result.error);
            alert('⚠️ Could not save to Google Sheets. Error: ' + (result.error || 'Unknown error'));
            throw new Error(result.error || `HTTP ${response.status}`);
        }
    } catch (error) {
        console.error('Error saving to Google Sheets:', error);
        alert('⚠️ Error saving data. Please try again.\n\nError: ' + error.message);
    } finally {
        isSyncing = false;
        document.getElementById('syncStatus').style.display = 'none';
    }
}

function getAgentList(data) {
    return [...new Set(data.map(e => e.agent))].sort();
}

function getActionCounts(data) {
    const counts = {};
    data.forEach(e => { counts[e.action] = (counts[e.action] || 0) + 1; });
    return counts;
}

function getEscalationStats(data) {
    let valid = 0, invalid = 0;
    data.forEach(e => {
        const comment = (e.evaluatorComment || '').toLowerCase();
        const action = e.action || '';
        
        const isInvalid = comment.includes('invalid') || 
                         comment.includes('reversal') ||
                         action.includes('Deduction') ||
                         action === 'Invalid' ||
                         action === 'Termination';
        
        const isValid = comment.includes('valid') || 
                       (action === 'Coaching / Written Memo' && !isInvalid);
        
        if (isInvalid) invalid++;
        else if (isValid) valid++;
        else {
            if (action.includes('Deduction') || action === 'Termination') invalid++;
            else valid++;
        }
    });
    return { valid, invalid };
}

function renderCharts(data) {
    const counts = getActionCounts(data);
    const actionOrder = ['Invalid', 'Coaching / Written Memo', '1-Day Deduction', '2-Days Deduction + Final Warning', 'Termination', 'Pending'];
    const maxVal = Math.max(...Object.values(counts), 1);
    const chartContainer = document.getElementById('actionChart');
    chartContainer.innerHTML = actionOrder.map(action => {
        const val = counts[action] || 0;
        const pct = maxVal > 0 ? Math.round((val / maxVal) * 100) : 0;
        const colorClass = action === 'Invalid' ? 'red' :
                          action === 'Coaching / Written Memo' ? 'green' :
                          action === '1-Day Deduction' ? 'red' :
                          action === '2-Days Deduction + Final Warning' ? 'gold' :
                          action === 'Termination' ? 'purple' : 'blue';
        return `
            <div class="chart-bar-item">
                <span class="label">${action}</span>
                <div class="bar-track">
                    <div class="bar-fill ${colorClass}" style="width: ${pct}%;"></div>
                </div>
                <span class="bar-value">${val}</span>
            </div>
        `;
    }).join('');

    const stats = getEscalationStats(data);
    const total = stats.valid + stats.invalid || 1;
    const validPct = Math.round((stats.valid / total) * 100);
    const invalidPct = Math.round((stats.invalid / total) * 100);
    document.getElementById('escalationPie').innerHTML = `
        <div class="pie-item">
            <div class="pie-circle green" style="background: conic-gradient(#4a7a4a 0% ${validPct}%, #2a2a2a ${validPct}% 100%);">${validPct}%</div>
            <span class="pie-label">Valid<br><span class="count">${stats.valid}</span></span>
        </div>
        <div class="pie-item">
            <div class="pie-circle red" style="background: conic-gradient(#7a4a4a 0% ${invalidPct}%, #2a2a2a ${invalidPct}% 100%);">${invalidPct}%</div>
            <span class="pie-label">Invalid<br><span class="count">${stats.invalid}</span></span>
        </div>
    `;
}

function renderAgentViolationChart(data) {
    const container = document.getElementById('agentViolationChart');
    if (!data.length) {
        container.innerHTML = '<div style="color:#666;font-size:11px;padding:8px 0;">No data available.</div>';
        return;
    }
    const agentMap = {};
    data.forEach(row => {
        const agent = row.agent || 'Unknown';
        const violation = row.violation || 'Other';
        if (!agentMap[agent]) agentMap[agent] = {};
        agentMap[agent][violation] = (agentMap[agent][violation] || 0) + 1;
    });
    
    const agentTotals = Object.keys(agentMap).map(agent => {
        const violations = agentMap[agent];
        const total = Object.values(violations).reduce((a,b) => a+b, 0);
        return { agent, violations, total };
    });
    
    const topAgents = agentTotals.sort((a, b) => b.total - a.total).slice(0, 10);
    
    let html = '';
    topAgents.forEach(({ agent, violations, total }) => {
        html += `<div class="agent-item">`;
        html += `<div class="agent-name">${agent} <span class="total">${total} violation${total > 1 ? 's' : ''}</span></div>`;
        const sortedViolations = Object.entries(violations).sort((a,b) => b[1] - a[1]);
        sortedViolations.forEach(([vType, count]) => {
            html += `<div class="violation-item"><span>${vType}</span><span class="v-count">${count}</span></div>`;
        });
        html += `</div>`;
    });
    container.innerHTML = html;
}

function renderStats(data) {
    const uniqueAgents = [...new Set(data.map(e => e.agent))];
    document.getElementById('totalAgents').textContent = uniqueAgents.length;
    document.getElementById('totalCases').textContent = data.length;
    const stats = getEscalationStats(data);

    document.getElementById('invalidEscalations').textContent = stats.invalid;
    document.getElementById('coachingCount').textContent = data.filter(e => e.action === 'Coaching / Written Memo').length;
    document.getElementById('deductionCount').textContent = data.filter(e => e.action === '1-Day Deduction').length;
    document.getElementById('totalRecordsDisplay').textContent = evaluations.length;
    document.getElementById('adminRecordCount').textContent = evaluations.length;
    if (evaluations.length > 0) {
        const oldest = evaluations.reduce((a, b) => {
            const dateA = new Date(a.cancellationDate || '2099-01-01');
            const dateB = new Date(b.cancellationDate || '2099-01-01');
            return dateA < dateB ? a : b;
        });
        document.getElementById('oldestRecordDisplay').textContent = new Date(oldest.cancellationDate).toLocaleDateString();
    }
}

function renderTable() {

    const agentFilter = document.getElementById('agentFilter').value;
    const filteredData = agentFilter
        ? dateFilteredData.filter(row => row.agent === agentFilter)
        : dateFilteredData;

    let filtered = filteredData.filter(row => {
        const matchSearch = row.agent.toLowerCase().includes(search) || row.chatId.toLowerCase().includes(search);
        const matchAction = actionFilter === '' || row.action === actionFilter;
        return matchSearch && matchAction;
    });

    const agentSelect = document.getElementById('agentFilter');
    const currentVal = agentSelect.value;
    const agents = getAgentList(dateFilteredData);
    agentSelect.innerHTML = '<option value="">All Agents</option>' + agents.map(a => `<option value="${a}">${a}</option>`).join('');

    const totalPages = Math.ceil(filtered.length / rowsPerPage) || 1;
    if (currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * rowsPerPage;
    const pageItems = filtered.slice(start, start + rowsPerPage);

    const tbody = document.getElementById('tableBody');
    if (pageItems.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding: 30px 0; color: #444;">No cases found</td></tr>`;
    } else {
        tbody.innerHTML = pageItems.map(row => {
            const tagClass = row.action === 'Invalid' ? 'tag-danger' :
                            row.action === 'Coaching / Written Memo' ? 'tag-coaching' :
                            row.action === '1-Day Deduction' ? 'tag-danger' :
                            row.action === '2-Days Deduction + Final Warning' ? 'tag-warning' :
                            row.action === 'Termination' ? 'tag-termination' : 'tag-info';
            const displayDate = row.cancellationDate ? new Date(row.cancellationDate).toLocaleDateString() : '—';
            return `
                <tr>
                    <td>${displayDate}</td>
                    <td><span class="chat-id-full" title="Click to copy: ${row.chatId}" onclick="copyChatId('${row.chatId}')">${row.chatId}</span></td>
                    <td>${row.contactReason}</td>
                    <td>${row.cancelReason}</td>
                    <td><span class="agent-badge">${row.agent}</span></td>
                    <td style="max-width:120px; font-size:11px; color:#888;">${row.violation}</td>
                    <td><span style="font-size:11px; color:#666;">${row.evaluatorComment || '—'}</span></td>
                    <td><span class="action-tag ${tagClass}">${row.action}</span></td>
                    <td>
                        <button class="btn-sm primary-sm" onclick="openEditModal('${row.chatId}')"><i class="fas fa-edit"></i></button>
                        ${isAdmin ? `<button class="btn-sm danger-sm" onclick="deleteRow('${row.chatId}')"><i class="fas fa-trash-alt"></i></button>` : ''}
                    </td>
                </tr>
            `;
        }).join('');
    }

    document.getElementById('rowCount').textContent = `${filtered.length} rows (${evaluations.length} total)`;
    document.getElementById('pageIndicator').textContent = `${currentPage} / ${totalPages}`;
    document.getElementById('prevPageBtn').disabled = currentPage === 1;
    document.getElementById('nextPageBtn').disabled = currentPage === totalPages;

    renderStats(filteredData);
    renderCharts(filteredData);
    renderAgentViolationChart(dateFilteredData);
}

function getFilteredData() {
    let filtered = [...evaluations];
    if (dateFilter.from) {
        const fromDate = new Date(dateFilter.from);
        fromDate.setHours(0, 0, 0, 0);
        filtered = filtered.filter(e => {
            const recordDate = new Date(e.cancellationDate);
            recordDate.setHours(0, 0, 0, 0);
            return recordDate >= fromDate;
        });
    }
    if (dateFilter.to) {
        const toDate = new Date(dateFilter.to);
        toDate.setHours(23, 59, 59, 999);
        filtered = filtered.filter(e => {
            const recordDate = new Date(e.cancellationDate);
            return recordDate <= toDate;
        });
    }
    return filtered;
}

function updateDateFilterStatus() {
    const statusEl = document.getElementById('dateFilterStatus');
    if (dateFilter.from && dateFilter.to) {
        const from = new Date(dateFilter.from).toLocaleDateString();
        const to = new Date(dateFilter.to).toLocaleDateString();
        statusEl.innerHTML = `<i class="fas fa-filter"></i> ${from} → ${to}`;
    } else if (dateFilter.from) {
        statusEl.innerHTML = `<i class="fas fa-filter"></i> From ${new Date(dateFilter.from).toLocaleDateString()}`;
    } else if (dateFilter.to) {
        statusEl.innerHTML = `<i class="fas fa-filter"></i> Until ${new Date(dateFilter.to).toLocaleDateString()}`;
    } else {
        statusEl.innerHTML = `<i class="fas fa-info-circle"></i> All dates`;
    }
}

// ================================================================
// 3. COPY FUNCTION
// ================================================================

function showToast(message) {
    const existing = document.querySelector('.copy-toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'copy-toast';
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => {
        if (toast.parentNode) toast.remove();
    }, 2000);
}

function copyChatId(chatId) {
    if (!chatId) {
        showToast('⚠️ No Chat ID selected');
        return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(chatId).then(() => {
            showToast('✅ Copied: ' + chatId);
            const btn = document.getElementById('copyChatIdBtn');
            btn.classList.add('copied');
            btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
            setTimeout(() => {
                btn.classList.remove('copied');
                btn.innerHTML = '<i class="fas fa-copy"></i> Copy';
            }, 2000);
        }).catch(() => {
            fallbackCopy(chatId);
        });
    } else {
        fallbackCopy(chatId);
    }
}

function fallbackCopy(text) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    try {
        document.execCommand('copy');
        showToast('✅ Copied: ' + text);
        const btn = document.getElementById('copyChatIdBtn');
        btn.classList.add('copied');
        btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
        setTimeout(() => {
            btn.classList.remove('copied');
            btn.innerHTML = '<i class="fas fa-copy"></i> Copy';
        }, 2000);
    } catch (err) {
        showToast('⚠️ Please copy manually: ' + text);
    }
    document.body.removeChild(textarea);
}

function populateChatDropdown(agent, date) {
    const chatSelect = document.getElementById('evalChatId');

    console.log('📋 populateChatDropdown called with agent:', agent, 'date:', date);
    console.log('📋 formData length:', formData.length);
    
    if (!agent) {
        chatSelect.innerHTML = '<option value="">Select Agent first...</option>';
        debugInfo.classList.remove('show');
        return;
    }
    
    let chats = formData.filter(e => e.agent === agent);
    console.log('📋 Found', chats.length, 'records for agent:', agent);
    
    const datesForAgent = [...new Set(chats.map(e => e.cancellationDate))];
    console.log('📅 Form - Dates for agent', agent, ':', datesForAgent);
    console.log('📅 Form - Selected date:', date);
    
    if (date) {
        const normalizedSelected = new Date(date);
        normalizedSelected.setHours(0, 0, 0, 0);
        chats = chats.filter(e => {
            const recordDate = new Date(e.cancellationDate);
            recordDate.setHours(0, 0, 0, 0);
            return recordDate.getTime() === normalizedSelected.getTime();
        });
        console.log('🔍 Form - Found', chats.length, 'records for date', date);
    }
    
    const chatIds = [...new Set(chats.map(e => e.chatId))];
    console.log('📋 Chat IDs found:', chatIds);
    
    if (chatIds.length === 0) {
        debugInfo.textContent = `ℹ️ No chat IDs found for ${agent} on ${date || 'any date'}. Available dates: ${datesForAgent.join(', ') || 'none'}`;
        debugInfo.classList.add('show');
        chatSelect.innerHTML = `<option value="">No Chat IDs available${date ? ' for this date' : ''}</option>`;
    } else {
        debugInfo.textContent = `✅ Found ${chatIds.length} chat ID(s) for ${date || 'all dates'}`;
        debugInfo.classList.add('show');
        chatSelect.innerHTML = '<option value="">Select Chat ID...</option>' + 
            chatIds.map(c => `<option value="${c}" style="font-family: \'Courier New\', monospace; font-size: 13px;">${c}</option>`).join('');
    }
}

// ================================================================
// FIXED: populateFormFields - Now properly sets Violation

function populateFormFields(chatId) {
    const record = formData.find(e => e.chatId === chatId);
    if (!record) return;
    
    console.log('📋 Populating form fields for chatId:', chatId);
    console.log('📋 Record found:', record);
    
    // Set Contact Reason
    const contactSelect = document.getElementById('evalContactReason');
    if (record.contactReason) {
        // Check if the value exists in the dropdown, if not, add it
        let optionExists = false;
        for (let i = 0; i < contactSelect.options.length; i++) {
            if (contactSelect.options[i].value === record.contactReason) {
                optionExists = true;
                break;
            }
        }
        if (!optionExists) {
            const newOption = document.createElement('option');
            newOption.value = record.contactReason;
            newOption.textContent = record.contactReason;
            contactSelect.appendChild(newOption);
        }
        contactSelect.value = record.contactReason;
        console.log('📋 Contact Reason set to:', contactSelect.value);
    }
    
    // Set Cancel Reason
    const cancelSelect = document.getElementById('evalCancelReason');
    if (record.cancelReason) {
        let optionExists = false;
        for (let i = 0; i < cancelSelect.options.length; i++) {
            if (cancelSelect.options[i].value === record.cancelReason) {
                optionExists = true;
                break;
            }
        }
        if (!optionExists) {
            const newOption = document.createElement('option');
            newOption.value = record.cancelReason;
            newOption.textContent = record.cancelReason;
            cancelSelect.appendChild(newOption);
        }
        cancelSelect.value = record.cancelReason;
        console.log('📋 Cancel Reason set to:', cancelSelect.value);
    }
    
    // ============================================================
    // CRITICAL FIX: Set Violation - Dynamically add if not exists
    // ============================================================
    const violationSelect = document.getElementById('evalViolation');
    if (record.violation) {
        console.log('📋 Setting violation to:', record.violation);
        
        // Check if the value exists in the dropdown
        let optionExists = false;
        for (let i = 0; i < violationSelect.options.length; i++) {
            if (violationSelect.options[i].value === record.violation) {
                optionExists = true;
                break;
            }
        }
        
        // If not found, add it dynamically
        if (!optionExists) {
            console.log('📋 Adding new violation option:', record.violation);
            const newOption = document.createElement('option');
            newOption.value = record.violation;
            newOption.textContent = record.violation;
            violationSelect.appendChild(newOption);
        }
        
        // Set the value
        violationSelect.value = record.violation;
        console.log('📋 Violation set to:', violationSelect.value);
    } else {
        console.log('📋 No violation found for this record');
    }
}

    const newEval = {
        cancellationDate: document.getElementById('evalDate').value,
        chatId: chatId,
        contactReason: document.getElementById('evalContactReason').value,
        cancelReason: document.getElementById('evalCancelReason').value,
        agent: agent,
        violation: document.getElementById('evalViolation').value,
        evaluatorComment: document.getElementById('evalComment').value.trim(),
        action: document.getElementById('evalAction').value
    };
    
    if (!newEval.chatId || !newEval.agent || !newEval.contactReason || !newEval.cancelReason || !newEval.violation || !newEval.action || !newEval.evaluatorComment) {
        alert('Please fill in all required fields (*)');
        return;
    }
    
    // Add to evaluations (dashboard data)
    evaluations.push(newEval);
    
    // Save to Google Sheets (Evaluations tab)
    await saveData(evaluations);
    
    // Remove from form data (so it doesn't appear again)
    formData = formData.filter(e => e.chatId !== chatId);
    
    closeEvalForm();
    renderTable();
    const btn = document.getElementById('submitEvalBtn');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<i class="fas fa-check"></i> Saved!';
    setTimeout(() => { btn.innerHTML = originalText; }, 1500);
});

document.getElementById('clearOldDataBtn').addEventListener('click', async function() {
    if (!isAdmin) {
        alert('⚠️ Admin access required.');
        return;
    }
    const cutoffDate = new Date();
    cutoffDate.setDate(cutoffDate.getDate() - 180);
    const oldRecords = evaluations.filter(e => new Date(e.cancellationDate) < cutoffDate);
    const newRecords = evaluations.filter(e => new Date(e.cancellationDate) >= cutoffDate);
    if (oldRecords.length === 0) {
        alert('ℹ️ No records older than 6 months found.');
        return;
    }
    if (!confirm(`⚠️ Remove ${oldRecords.length} record(s) older than 6 months?`)) return;
    evaluations = newRecords;
    await saveData(evaluations);
    renderTable();
    alert(`✅ Removed ${oldRecords.length} record(s). ${evaluations.length} remain.`);
});

document.getElementById('clearAllDataBtn').addEventListener('click', async function() {

        alert('⚠️ Admin access required.');
        return;

    const count = evaluations.length;
    if (count === 0) { alert('ℹ️ No data to delete.'); return; }
    if (!confirm(`⚠️⚠️⚠️ Delete ALL ${count} record(s)?`)) return;
    if (!confirm(`⚠️ FINAL WARNING: Type "DELETE ALL" to confirm.`)) return;
    const confirmation = prompt('Type "DELETE ALL" to confirm:');
    if (confirmation !== 'DELETE ALL') { alert('✅ Cancelled.'); return; }
    evaluations = [];

    renderTable();
    alert(`✅ All ${count} record(s) deleted.`);
});

document.getElementById('downloadCsvBtn').addEventListener('click', function() {
    if (evaluations.length === 0) { alert('⚠️ No data to export.'); return; }
    const headers = ['Cancellation Date', 'Chat ID', 'Contact Reason', 'Cancellation Reason', 'Agent Email', 'Non Compliant Reason', 'Evaluator Comment', 'Action'];
    const rows = evaluations.map(e => [e.cancellationDate || '', e.chatId || '', e.contactReason || '', e.cancelReason || '', e.agent || '', e.violation || '', e.evaluatorComment || '', e.action || '']);
    let csvContent = headers.join(',') + '\n';
    rows.forEach(row => {
        const escapedRow = row.map(cell => {
            if (typeof cell === 'string' && (cell.includes(',') || cell.includes('"') || cell.includes('\n'))) {
                return `"${cell.replace(/"/g, '""')}"`;
            }
            return cell;
        });
        csvContent += escapedRow.join(',') + '\n';
    });
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);
    link.setAttribute('href', url);
    link.setAttribute('download', `evaluations_${new Date().toISOString().slice(0,10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
});

document.getElementById('downloadExcelBtn').addEventListener('click', function() {
    if (evaluations.length === 0) { alert('⚠️ No data to export.'); return; }
    const headers = ['Cancellation Date', 'Chat ID', 'Contact Reason', 'Cancellation Reason', 'Agent Email', 'Non Compliant Reason', 'Evaluator Comment', 'Action'];
    let tableHtml = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">';
    tableHtml += '<head><meta charset="UTF-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>Evaluations</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head>';
    tableHtml += '<body><table>';
    tableHtml += '<tr>' + headers.map(h => `<th style="font-weight:bold; background:#333; color:#fff; padding:8px;">${h}</th>`).join('') + '</tr>';
    evaluations.forEach(e => {
        tableHtml += `<tr><td>${e.cancellationDate || ''}</td><td>${e.chatId || ''}</td><td>${e.contactReason || ''}</td><td>${e.cancelReason || ''}</td><td>${e.agent || ''}</td><td>${e.violation || ''}</td><td>${e.evaluatorComment || ''}</td><td>${e.action || ''}</td></tr>`;
    });
    tableHtml += '</table></body></html>';
    const blob = new Blob([tableHtml], { type: 'application/vnd.ms-excel;charset=utf-8' });
    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);
    link.setAttribute('href', url);
    link.setAttribute('download', `evaluations_${new Date().toISOString().slice(0,10)}.xls`);

});

let lastDataHash = '';

async function checkForUpdates() {
    try {
        const response = await fetch(GOOGLE_SHEETS_API_URL);
        const result = await response.json();
        if (result.success && result.data) {
            const newData = result.data;
            const newHash = JSON.stringify(newData);
            if (newHash !== lastDataHash) {
                lastDataHash = newHash;
                evaluations = newData;
                renderTable();
                console.log('🔄 Auto-refreshed dashboard from Google Sheets');
            }
        }
    } catch (error) {
        // Silently fail
    }
}

setInterval(checkForUpdates, 10000);

async function initDashboard() {
    console.log('🚀 Initializing dashboard...');
    
    // Load dashboard data (Evaluations tab)
    evaluations = await loadDashboardData();
    lastDataHash = JSON.stringify(evaluations);
    
    // Load form data (Data tab)
    formData = await loadFormData();
    console.log('📋 Form data loaded:', formData.length, 'records from Data tab');
    
    updateDateFilterStatus();
    renderTable();
    console.log('📋 Evaluator Dashboard loaded - Connected to Google Sheets');
    console.log('🔗 Google Sheets API URL:', GOOGLE_SHEETS_API_URL);
}

initDashboard();
